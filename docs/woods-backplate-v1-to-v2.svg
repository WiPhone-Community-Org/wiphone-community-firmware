<style>
  .bg{fill:#ffffff}
  .tt{font-size:17px;font-weight:bold;fill:#111}
  .h{font-size:14px;font-weight:bold;fill:#111}
  .t{font-size:13px;fill:#111}
  .ts{font-size:11.5px;fill:#444}
  .tw{font-size:12px;fill:#b03030;font-weight:bold}
  .note{font-size:11px;fill:#666}
  .new{fill:#eafaf1;stroke:#1e8a5a;stroke-width:2}
  .chg{fill:#fff4e6;stroke:#c47a1a;stroke-width:2}
  .same{fill:#f4f4f4;stroke:#999;stroke-width:1.5}
  .warn{fill:#fdeaea;stroke:#b03030;stroke-width:2}
  .chk{fill:#fffbe8;stroke:#8a7a1e;stroke-width:2}
  .box{fill:#fff;stroke:#333;stroke-width:2}
  .w5v{stroke:#c0392b;stroke-width:2.6;fill:none}
  .wbat{stroke:#8b1a1a;stroke-width:2.6;fill:none}
