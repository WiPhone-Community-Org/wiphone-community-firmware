; PlatformIO project configuration for the WiPhone firmware.
;
; Reconstructed from WiPhone's custom Arduino board package (WiPhone0.1.2), which
; is stock arduino-esp32 1.0.5-rc7 plus a 16 MB partition table and a PSRAM-enabled
; board entry. All hardware pins are defined in the firmware itself (Hardware.h and
; src/TFT_eSPI/User_Setup.h), so no custom pin variant is required here.
;
; espressif32 @ 3.5.0 (pinned below) ships arduino-esp32 1.0.6 (core_version.h), one
; point release past the WiPhone package's 1.0.5-rc7. ⚠ Its initArduino() releases the
; Bluetooth DRAM reserve at boot UNLESS anything in the firmware references
; btStart/btStop (that links esp32-hal-bt.c, whose btInUse() returns true) - see
; Networks::disable() and CHANGELOG 0.9.75 before adding any Bluetooth call.

[platformio]
src_dir = WiPhone
; WiPhone's SPIFFS filesystem image (configs, ringtones, fonts) lives in the
; sketch subfolder rather than PlatformIO's default data/ directory.
data_dir = WiPhone/data

[env:wiphone]
platform = espressif32@3.5.0
framework = arduino
board = wiphone

; Firmware lives in the WiPhone/ sketch folder rather than the default src/.
; RadioHead (WiPhone's patched copy) is vendored under lib/.

; MP3 decoding is VENDORED, not a lib_dep — src/audio/helix-mp3/, alongside the g711/g722
; and dr_wav that were already there. Two reasons it is not pulled from the registry:
;   1. The popular Arduino wrapper around helix is GPLv3, which does not sit well inside
;      firmware under the WiPhone Public License. The raw helix sources underneath it are
;      RPSL only, so vendoring those and writing our own glue avoids the problem entirely.
;   2. helix's allocator has to be replaced to reach PSRAM (see helix_memory.c), and you
;      cannot patch a file that a dependency manager re-downloads.
; ⚠ helix is RealNetworks RPSL. Open source, satisfied by this repo being public, but NOT
; MIT — worth knowing before any of this is reused elsewhere.

board_build.partitions = partitions/default_16MB.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; SPI-RAM (PSRAM) cache workaround required by the WROVER module on this core.
; -Wno-error matches WiPhone's Arduino build, which used the default (empty) warning
; level; PlatformIO otherwise injects -Werror=reorder/-Werror=return-type and fails.
; (-mfix-esp32-psram-cache-issue removed: this phone's chip is ESP32-D0WDQ6-V3,
; revision 3 per esptool, which doesn't have the rev-1 PSRAM cache bug. The
; workaround pessimizes all generated code — the emulator can't afford it.)
;
; 🛑 --wrap=esp_wifi_start / esp_wifi_stop: EVERY start and stop of the WiFi radio, whoever calls
; it (the core, GUI.cpp's bare calls, the core's event-task auto-reconnect), goes through
; WiPhone/cpu_clock.cpp first. That is how the CPU clock knows the radio runs - it must never
; re-lock the BBPLL under it (cpu_clock_policy.h) - and how the clock gets OFF PLL 480 before the
; radio comes up. Without them the gate would believe the radio is always off and re-lock the PLL
; under it again (the 4-of-4 WiFi break). Serial `cpu` shows `radio ON` when they are working.
;
; --wrap=mbedtls_ecp_grp_id_list (0.9.81): the TLS ClientHello offers P-256 first, not mbedTLS 2.16's
; P-521 (WiPhone/tls_curves.cpp; the rule, host-tested, in tls_curves.h). api.open-meteo.com takes the
; client's first curve, and a software P-521 ECDHE is ~6-9x a P-256 one on this chip. It is GLOBAL -
; every TLS client (weather, AI, the map downloader, OTA) - and lists exactly the linked table's
; curves: an id outside it fails EVERY handshake (MBEDTLS_ERR_SSL_BAD_CONFIG), never just the one.
build_flags =
    -Wno-error
    -Wl,--wrap=esp_wifi_start
    -Wl,--wrap=esp_wifi_stop
    -Wl,--wrap=mbedtls_ecp_grp_id_list

; Strip the -Werror flags PlatformIO injects for the Arduino framework; WiPhone's
; build left them as plain warnings (empty default warning level).
build_unflags =
    -Werror=reorder
    -Werror=return-type
    -Werror=all

monitor_speed = 500000    ; the firmware console runs at 500000 (Hardware.h SERIAL_BAUD)
upload_speed = 921600
